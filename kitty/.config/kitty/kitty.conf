# Fonts
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Malayalam Fallback Mapping
symbol_map U+0D00-U+0D7F Noto Sans Malayalam

# Performance and Modifiers
disable_ligatures no
enable_audio_bell no

# Shell Configuration
shell zsh
shell_integration disabled

# Cursor Customization
cursor_shape block
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_color white
cursor_blink_interval 0 

# Window and Style
url_style curly 
remember_window_size no
window_padding_width 13
background_opacity 0.49

# Scrollbar 
scrollbar_handle_opacity 0 
scrollbar_track_opacity 0 
scrollbar_track_hover_opacity 0

# Window Closing Behaviour
confirm_os_window_close 0

