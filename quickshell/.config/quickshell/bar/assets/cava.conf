[general]
framerate = 30
bars = 10
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
channels = mono

[smoothing]
monstercat = 1
waves = 0
noise_reduction = 77
